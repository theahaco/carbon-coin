name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm run prototype:setup

      - run: npm ci

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
      - run: npm run cli:lint

      - run: npm run web:build

      - run: npm run web:test

  integration:
    name: Integration tests
    # ubuntu-latest is linux/amd64 (matching the rippled image platform pinned
    # in test/helpers/rippledNode.ts) and ships with a working Docker daemon, which
    # testcontainers needs to spin up a stand-alone rippled node per test file.
    runs-on: ubuntu-latest
    # Each test file starts its own rippled container and the files run
    # sequentially (fileParallelism: false), so the suite is slow by design.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm run prototype:setup

      - run: npm ci

      # Pull ahead of time so a slow image pull can't eat into the 60s
      # container startup timeout in test/helpers/rippledNode.ts.
      - name: Pull rippled image
        run: docker pull --platform linux/amd64 rippleci/rippled:latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .prototype/xrpl-rust/target
          key: cli-${{ runner.os }}-${{ hashFiles('cli.json', 'cli/Cargo.lock') }}
          restore-keys: cli-${{ runner.os }}-

      - run: npm run cli:setup

      - run: npm run test:integration
